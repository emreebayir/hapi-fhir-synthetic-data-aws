services:
  db:
    image: postgres:16-alpine
    container_name: fhir-postgres
    environment:
      POSTGRES_DB: hapi
      POSTGRES_USER: hapi
      POSTGRES_PASSWORD: hapi_secure_password_2026
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  hapi-fhir:
    image: hapiproject/hapi:latest
    container_name: fhir-server
    depends_on:
      - db
    ports:
      - "8080:8080"
    environment:
      JAVA_OPTS: "-Xms512m -Xmx1536m"
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/hapi
      SPRING_DATASOURCE_USERNAME: hapi
      SPRING_DATASOURCE_PASSWORD: hapi_secure_password_2026
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      HAPI_FHIR_DATABASE_TYPE: POSTGRES_42
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.PostgreSQLDialect
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.PostgreSQLDialect
    restart: always

  nginx:
    image: nginx:alpine
    container_name: fhir-proxy
    depends_on:
      - hapi-fhir
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    restart: always

volumes:
  postgres_data:
